packages:
  - apps/*
  - packages/*
  - tools/*

catalogMode: prefer

catalog:
  "@neondatabase/serverless": ^1.2.0
  "@types/node": ^24
  "@types/react": ^19.3.0
  "@types/react-dom": ^19.3.0
  "@vitejs/plugin-react": ^6.2.1
  argon2: ^0.45.2
  dotenv: ^18.0.10
  drizzle-kit: ^0.31.11
  drizzle-orm: 1.0.0-rc.5
  react: ^19.3.1
  react-dom: ^19.3.1
  react-router: ^8.5.1
  typescript: ^7.0.2
  vite: npm:@voidzero-dev/vite-plus-core@1.5.0
  vite-plus: 1.5.0
overrides:
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
allowBuilds:
  argon2: true
  esbuild: false
